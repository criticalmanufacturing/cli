name: Release artifact checks
on:
  pull_request:
    paths: ['.github/scripts/release-artifacts*', '.github/release-artifacts.json', '.github/workflows/*publish*', '.github/workflows/*artifact*']
  push:
    branches: [main, development]
    paths: ['.github/scripts/release-artifacts*', '.github/release-artifacts.json', '.github/workflows/*publish*', '.github/workflows/*artifact*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test .github/scripts/release-artifacts.test.mjs
