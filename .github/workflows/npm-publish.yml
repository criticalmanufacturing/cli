# Build release binaries, publish to the registry, verify all download sources, then publish npm/NuGet.
# Publication setup: .github/RELEASE-ARTIFACTS.md
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: cmf-cli

on:
  release:
    types: [published]
concurrency:
  group: release-artifacts-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  build-binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Validate release version and artifact checks
        run: |
          test "$RELEASE_TAG" = "$(node -p "require('./npm/package.json').version")"
          node --test .github/scripts/release-artifacts.test.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: install zip
        uses: montudor/action-zip@v0.1.0
      - run: npm ci
      - run: npm run build:prod
      - name: create artifact win-x64
        run: zip -X -r ../cmf-cli.win-x64.zip .
        working-directory: dist/win-x64
      - name: Create artifact linux-x64
        run: zip -X -r ../cmf-cli.linux-x64.zip .
        working-directory: dist/linux-x64
      - name: Publish win-x64 to release
        run: gh release upload "$RELEASE_TAG" dist/cmf-cli.win-x64.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish linux-x64 to release
        run: gh release upload "$RELEASE_TAG" dist/cmf-cli.linux-x64.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  publish-and-verify-binaries:
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Require registry publishing credentials
        run: test -n "$CRITICALMANUFACTURING_IO_TOKEN"
        env:
          CRITICALMANUFACTURING_IO_TOKEN: ${{ secrets.CRITICALMANUFACTURING_IO_TOKEN }}
      - name: Download original release binaries
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" --pattern '*.zip' --dir dist
          for archive in dist/*.zip; do unzip -tq "$archive"; done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish binaries to the registry
        shell: bash
        run: |
          : "${TARGET_IP:?Set the CRITICALMANUFACTURING_IO_IP secret to the registry origin IP.}"
          trap 'sudo sed -i "/ # cmf-cli-registry-origin$/d" /etc/hosts' EXIT
          printf '%s admin.criticalmanufacturing.io # cmf-cli-registry-origin\n' "$TARGET_IP" | sudo tee -a /etc/hosts > /dev/null
          node .github/scripts/release-artifacts.mjs publish "$RELEASE_TAG"
        env:
          TARGET_IP: ${{ secrets.CRITICALMANUFACTURING_IO_IP }}
          CRITICALMANUFACTURING_IO_TOKEN: ${{ secrets.CRITICALMANUFACTURING_IO_TOKEN }}
      - name: Verify every binary on GitHub, criticalmanufacturing.io and China
        run: node .github/scripts/release-artifacts.mjs verify "$RELEASE_TAG"

  publish-npm:
    needs: publish-and-verify-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Trusted publishing (OIDC): no NPM_TOKEN. Node 24 ships npm >= 11.5.1.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
      - run: npm run publish
        if: "github.event.release.prerelease"
      - run: npm run publish:live
        if: "!github.event.release.prerelease"

  publish-core-nuget:
    needs: publish-and-verify-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Re-version Core Nuget for pre-release
        if: "github.event.release.prerelease"
        run: sed -i.orig -E 's/([0-9]+)\.([0-9]+)\.([0-9]+)-([0-9]+)/\1\.\2\.\3-pre.\4/' core.csproj
        working-directory: ./core
      - name: Pack Core NuGet
        run: dotnet pack core/core.csproj --configuration Release --output core/nupkg
      # Trusted publishing (OIDC): no NUGET_API_KEY. The key below is short-lived,
      # so log in immediately before pushing.
      - name: NuGet login (OIDC → temporary API key)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish Core NuGet
        run: dotnet nuget push "core/nupkg/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" --skip-duplicate --no-symbols
