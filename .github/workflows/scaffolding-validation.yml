name: CLI Scaffolding Validation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit to validate (run this workflow from main)'
        required: true
        default: main
        type: string
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: scaffolding-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

env:
  NG_CLI_ANALYTICS: false
  CRITICALMANUFACTURING_IO_USER: ${{ vars.CRITICALMANUFACTURING_IO_USER }}
  CRITICALMANUFACTURING_NPM_REGISTRY: ${{ vars.CRITICALMANUFACTURING_NPM_REGISTRY }}
  CRITICALMANUFACTURING_NUGET_REGISTRY: ${{ vars.CRITICALMANUFACTURING_NUGET_REGISTRY }}
  VALIDATION_DIR: scaffolding-validation
  PACKAGES_TO_CREATE: "business data html help test database reporting grafana iot securityPortal"

jobs:
  resolve-source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      repository: ${{ steps.source.outputs.repository }}
      environment: ${{ steps.source.outputs.environment }}
    steps:
      # No target checkout or target code executes before environment approval.
      - name: Pin the commit to validate
        id: source
        uses: actions/github-script@v8
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        with:
          github-token: ${{ github.token || 'unused' }}
          script: |
            let sha = context.sha;
            let repository = `${context.repo.owner}/${context.repo.repo}`;
            let environment = 'scaffolding-review';
            if (context.eventName === 'pull_request_target') {
              if (context.payload.pull_request.base.ref !== 'main') throw new Error('Only PRs targeting main are supported.');
              sha = context.payload.pull_request.head.sha;
              repository = context.payload.pull_request.head.repo.full_name;
            } else if (context.eventName === 'workflow_dispatch') {
              if (context.ref !== 'refs/heads/main') throw new Error('Select main under Run workflow, then supply the target in the ref input.');
              const commit = await github.rest.repos.getCommit({ ...context.repo, ref: process.env.REQUESTED_REF });
              sha = commit.data.sha;
            } else if (context.eventName === 'push' && context.ref === 'refs/heads/main') {
              environment = 'scaffolding-main';
            } else {
              throw new Error(`Unsupported event: ${context.eventName} ${context.ref}`);
            }
            core.setOutput('sha', sha);
            core.setOutput('repository', repository);
            core.setOutput('environment', environment);
            await core.summary.addHeading('Scaffolding validation target')
              .addLink(`${repository}@${sha}`, `${context.serverUrl}/${repository}/commit/${sha}`)
              .addRaw(`\n\nEnvironment: ${environment}\n`).write();

  build-cli:
    needs: resolve-source
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.resolve-source.outputs.environment }}
      url: https://github.com/${{ needs.resolve-source.outputs.repository }}/commit/${{ needs.resolve-source.outputs.sha }}
    steps:
      # act copies the working tree only for checkout without an explicit repository/ref.
      - name: Use local checkout
        if: env.ACT == 'true'
        uses: actions/checkout@v4

      - name: Checkout repository
        if: env.ACT != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve-source.outputs.repository }}
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
          # Fork code executes only after a reviewer approves this pinned commit.
          allow-unsafe-pr-checkout: true

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build:bundle:linux

      - name: Upload CLI package
        uses: actions/upload-artifact@v4
        with:
          name: cli-linux-x64-${{ needs.resolve-source.outputs.sha }}
          path: npm/dist/linux-x64
          retention-days: 1
          overwrite: true
          include-hidden-files: true

  scaffolding-validation:
    needs: [resolve-source, build-cli]
    name: Scaffolding MES ${{ matrix.mes-major }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.resolve-source.outputs.environment }}
      url: https://github.com/${{ needs.resolve-source.outputs.repository }}/commit/${{ needs.resolve-source.outputs.sha }}
    env:
      CRITICALMANUFACTURING_IO_TOKEN: ${{ secrets.SCAFFOLDING_REGISTRY_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # MES 10/11 Tests need environment-generated LBOs; validate their scaffolding only.
          - mes-major: 10
            node-version: '18.x'
            dotnet-version: '6.0.x'
            packages-to-build: "Cmf.Custom.Business Cmf.Custom.Data Cmf.Custom.HTML Cmf.Custom.Help"
            packages-to-pack: "Cmf.Custom.Business Cmf.Custom.Data Cmf.Custom.HTML Cmf.Custom.Grafana Cmf.Custom.IoT Cmf.Custom.SecurityPortal Cmf.Custom.Database/Pre Cmf.Custom.Database/Post Cmf.Custom.Help Cmf.Custom.Reporting Cmf.Custom.IoT"
          - mes-major: 11
            node-version: '20.x'
            dotnet-version: '8.0.x'
            packages-to-build: "Cmf.Custom.Business Cmf.Custom.Data Cmf.Custom.HTML Cmf.Custom.Help"
            packages-to-pack: "Cmf.Custom.Business Cmf.Custom.Data Cmf.Custom.HTML Cmf.Custom.Help Cmf.Custom.Grafana Cmf.Custom.IoT Cmf.Custom.SecurityPortal Cmf.Custom.Database/Pre Cmf.Custom.Database/Post Cmf.Custom.Help Cmf.Custom.Reporting Cmf.Custom.IoT"
          - mes-major: 12
            node-version: '24.x'
            dotnet-version: '10.0.x'
            packages-to-build: "Cmf.Custom.Business Cmf.Custom.Data Cmf.Custom.HTML Cmf.Custom.Help Cmf.Custom.Tests"
            packages-to-pack: "Cmf.Custom.Business Cmf.Custom.Data Cmf.Custom.HTML Cmf.Custom.Help Cmf.Custom.Grafana Cmf.Custom.IoT Cmf.Custom.SecurityPortal Cmf.Custom.Database/Pre Cmf.Custom.Database/Post Cmf.Custom.Help Cmf.Custom.Reporting Cmf.Custom.IoT Cmf.Custom.Tests"

    steps:
      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Download CLI package
        uses: actions/download-artifact@v4
        with:
          name: cli-linux-x64-${{ needs.resolve-source.outputs.sha }}
          path: npm/dist/linux-x64

      - name: Set CLI_PATH env var and execute permission
        working-directory: npm
        run: |
          chmod +x ./dist/linux-x64/cmf
          echo "CLI_PATH=$GITHUB_WORKSPACE/npm/dist/linux-x64" >> $GITHUB_ENV

      - name: Login to NPM registry
        if: env.CRITICALMANUFACTURING_IO_TOKEN != ''
        run: |
          $CLI_PATH/cmf -l debug login NPM $CRITICALMANUFACTURING_NPM_REGISTRY --auth-type Basic --username $CRITICALMANUFACTURING_IO_USER --password $CRITICALMANUFACTURING_IO_TOKEN

      - name: Login to NuGet registry
        if: env.CRITICALMANUFACTURING_IO_TOKEN != ''
        run: |
          $CLI_PATH/cmf -l debug login NuGet $CRITICALMANUFACTURING_NUGET_REGISTRY --auth-type Basic --username $CRITICALMANUFACTURING_IO_USER --password $CRITICALMANUFACTURING_IO_TOKEN --key CMF

      - name: Resolve full MES version for major ${{ matrix.mes-major }}
        id: mes-version
        run: |
          node - <<'NODE'
          const major = "${{ matrix.mes-major }}";
          const registry = process.env.CRITICALMANUFACTURING_NPM_REGISTRY;
          const pkg = 'cmf-mes-ui';
          const tagsJson = require('child_process').execFileSync('npm', ['view', pkg, 'dist-tags', '--json', '--registry', registry], { encoding: 'utf8' });
          const releases = Object.entries(JSON.parse(tagsJson || '{}'))
            .filter(([tag]) => new RegExp(`^release-${major}[0-9]{2,}$`).test(tag));
          if (releases.length === 0) { console.error(`No release tags found for MES ${major}.x`); process.exit(1); }
          releases.sort(([a], [b]) => a.localeCompare(b, 'en', { numeric: true }));
          const [tag, version] = releases[releases.length - 1];
          console.log(`MES ${major}: ${tag} -> ${version}`);
          require('fs').appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\nversion=${version}\n`);
          NODE

      - name: Resolve ngx-schematics version for MES ${{ steps.mes-version.outputs.version }}
        id: ngx-schematics-version
        env:
          MES_DIST_TAG: ${{ steps.mes-version.outputs.tag }}
        run: |
          if ! NGX_VERSION=$(npm view @criticalmanufacturing/ngx-schematics@$MES_DIST_TAG version --registry "$CRITICALMANUFACTURING_NPM_REGISTRY") || [ -z "$NGX_VERSION" ]; then
            echo "::error::Failed to resolve ngx-schematics version for tag $MES_DIST_TAG"
            exit 1
          fi
          echo "version=$NGX_VERSION" >> $GITHUB_OUTPUT

      - name: Create parameters.json file
        run: |
          mkdir -p $VALIDATION_DIR
          cat <<EOF > $VALIDATION_DIR/parameters.json
          {
            "SYSTEM_NAME": "cmftraining",
            "TENANT_NAME": "cmftraining",
            "APPLICATION_PUBLIC_HTTP_ADDRESS": "cmftraining.local",
            "APPLICATION_PUBLIC_HTTP_PORT": "80",
            "APPLICATION_PUBLIC_HTTP_TLS_ENABLED": "false",
            "DATABASE_ONLINE_MSSQL_ADDRESS": "db",
            "DATABASE_ONLINE_MSSQL_ADDRESS": "db",
            "SECURITY_PORTAL_STRATEGY_LOCAL_AD_DEFAULT_DOMAIN": "",
            "DATABASE_MSSQL_ALWAYS_ON_ENABLED": "false"
          }
          EOF

      - name: Run 'cmf init' (MES ${{ steps.mes-version.outputs.version }})
        working-directory: ${{ env.VALIDATION_DIR }}
        env:
          MES_VERSION: ${{ steps.mes-version.outputs.version }}
          NGX_VERSION: ${{ steps.ngx-schematics-version.outputs.version }}
        run: |
          # MES compatibility uses major.minor.patch; package versions retain their suffixes.
          MES_BASE_VERSION=${MES_VERSION%%[-+]*}
          $CLI_PATH/cmf -l debug init ValidationProject \
            --version 1.0.0 \
            --config ./parameters.json \
            --MESVersion "$MES_BASE_VERSION" \
            --nugetVersion "$MES_VERSION" \
            --testScenariosNugetVersion "$MES_VERSION" \
            --npmRegistry $CRITICALMANUFACTURING_NPM_REGISTRY \
            --nugetRegistry $CRITICALMANUFACTURING_NUGET_REGISTRY \
            --deploymentDir ./deployments \
            --ngxSchematicsVersion "$NGX_VERSION"

      - name: Run 'cmf new' for each package type
        working-directory: ${{ env.VALIDATION_DIR }}
        run: |
          for pkg in $PACKAGES_TO_CREATE; do
            if [ "$pkg" = "data" ]; then
              cmd="$CLI_PATH/cmf -l debug new $pkg --businessPackage ./Cmf.Custom.Business/"
            elif [ "$pkg" = "iot" ]; then
              cmd="$CLI_PATH/cmf -l debug new $pkg --htmlPackageLocation ./Cmf.Custom.HTML/"
            else
              cmd="$CLI_PATH/cmf -l debug new $pkg"
            fi
            echo -e "\nRunning: $cmd"
            $cmd
          done

      - name: Run 'cmf build' for each package
        working-directory: ${{ env.VALIDATION_DIR }}
        run: |
          for pkg in ${{ matrix.packages-to-build }}; do
            cmd="$CLI_PATH/cmf -l debug build $pkg"
            echo -e "\nRunning: $cmd"
            $cmd
          done

      - name: Add validation package content
        working-directory: ${{ env.VALIDATION_DIR }}
        run: |
          mkdir -p Cmf.Custom.Database/Pre/ONLINE/UpgradeScripts/1.0.0
          printf 'SELECT 1;\n' > Cmf.Custom.Database/Pre/ONLINE/UpgradeScripts/1.0.0/000-validation.sql
          mkdir -p Cmf.Custom.Reporting/1.0.0
          printf '<Report xmlns="http://schemas.microsoft.com/sqlserver/reporting/2016/01/reportdefinition" />\n' > Cmf.Custom.Reporting/1.0.0/validation.rdl

      - name: Run 'cmf pack' for each package
        working-directory: ${{ env.VALIDATION_DIR }}
        run: |
          for pkg in ${{ matrix.packages-to-pack }}; do
            cmd="$CLI_PATH/cmf -l debug pack $pkg"
            echo -e "\nRunning: $cmd"
            $cmd
          done

  # Branch protection requires named checks, not the workflow's overall result.
  # A failed build skips the matrix jobs, and skipped checks can allow merging.
  # Always run this single required check and fail unless source resolution,
  # the build, and every MES matrix job succeeded.
  required:
    name: CLI scaffolding required
    needs: [resolve-source, build-cli, scaffolding-validation]
    if: always()
    runs-on: ubuntu-latest
    env:
      RESULTS: ${{ toJSON(needs.*.result) }}
    steps:
      - name: Require every validation job to succeed
        run: |
          node -e 'if (!JSON.parse(process.env.RESULTS).every(result => result === "success")) process.exit(1)'
